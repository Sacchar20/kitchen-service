<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Kitchen Service - Soft UI</title>

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <link href="https://demos.creative-tim.com/soft-ui-design-system/assets/css/soft-design-system.min.css?v=1.0.9" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-vh-100 d-flex flex-column">

    <div class="container position-sticky z-index-sticky top-0">
        <div class="row">
            <div class="col-12">
                <nav class="navbar navbar-expand-lg blur blur-rounded top-0 z-index-fixed shadow position-absolute my-3 py-2 start-0 end-0 mx-4">
                    <div class="container-fluid px-0">
                        <a class="navbar-brand font-weight-bolder ms-sm-3" href="{% url 'kitchen:index' %}">
                            <i class="fas fa-utensils text-gradient text-primary me-2"></i> Kitchen Service
                        </a>
                        <button class="navbar-toggler shadow-none ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon mt-2">
                                <span class="navbar-toggler-bar bar1"></span>
                                <span class="navbar-toggler-bar bar2"></span>
                                <span class="navbar-toggler-bar bar3"></span>
                            </span>
                        </button>
                        <div class="collapse navbar-collapse pt-3 pb-2 py-lg-0 w-100" id="navigation">
                            <ul class="navbar-nav navbar-nav-hover mx-auto">
                                <li class="nav-item mx-2">
                                    <a class="nav-link ps-2 d-flex justify-content-between cursor-pointer align-items-center" href="{% url 'kitchen:index' %}">
                                        Home
                                    </a>
                                </li>
                                <li class="nav-item mx-2">
                                    <a class="nav-link ps-2 d-flex justify-content-between cursor-pointer align-items-center" href="{% url 'kitchen:dish-type-list' %}">
                                        Dish Types
                                    </a>
                                </li>
                                <li class="nav-item mx-2">
                                    <a class="nav-link ps-2 d-flex justify-content-between cursor-pointer align-items-center" href="{% url 'kitchen:dish-list' %}">
                                        Dishes Menu
                                    </a>
                                </li>
                                <li class="nav-item mx-2">
                                    <a class="nav-link ps-2 d-flex justify-content-between cursor-pointer align-items-center" href="{% url 'kitchen:cook-list' %}">
                                        Our Cooks
                                    </a>
                                </li>
                            </ul>

                            <div class="ms-auto d-flex align-items-center me-sm-3">
                                {% if user.is_authenticated %}
                                    <span class="text-sm text-secondary me-3 d-none d-sm-inline">
                                        Hi, <strong class="text-dark">{{ user.username }}</strong>!
                                    </span>
                                    <form method="post" action="{% url 'logout' %}" class="d-inline m-0">
                                        {% csrf_token %}
                                        <button type="submit" class="btn btn-sm btn-round mb-0 bg-gradient-danger">Logout</button>
                                    </form>
                                {% else %}
                                    <span class="text-sm text-secondary me-3 d-none d-sm-inline">Guest Mode</span>
                                    <a href="{% url 'login' %}" class="btn btn-sm btn-round mb-0 bg-gradient-primary">Sign In</a>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://demos.creative-tim.com/soft-ui-design-system/assets/js/core/bootstrap.min.js" type="text/javascript"></script>
</body>
</html>
