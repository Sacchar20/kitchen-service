{% extends "kitchen/base.html" %}

{% block content %}
<div class="flex-grow-1 position-relative" style="background-color: #e4e8f0 !important; min-height: 100vh; margin-top: -1rem; padding-top: 5rem; padding-bottom: 5rem;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 col-sm-9">
                <div class="card shadow-lg border-0 p-4" style="border-radius: 1rem; background-color: #ffffff !important;">

                    <div class="text-center mb-4">
                        <div class="rounded-circle d-flex align-items-center justify-content-center shadow-sm mx-auto mb-3" style="width: 4.5rem; height: 4.5rem; background: linear-gradient(135deg, #ea4335 0%, #c5221f 100%); color: #ffffff;">
                            <i class="fas fa-hamburger fa-lg"></i>
                        </div>
                        <h4 class="font-weight-bolder text-dark mb-1">Delete Dish</h4>
                        <p class="text-xs text-secondary mb-0">Removing this recipe will clear it from the active menu</p>
                    </div>

                    <div class="alert bg-gray-100 text-center border-radius-md py-3 px-3 mb-4" style="border: 1px solid #f0f2f5;">
                        <p class="text-sm text-dark mb-0">
                            Are you sure you want to permanently delete the dish:
                            <strong class="text-danger d-block text-base mt-1">{{ dish.name }}</strong>
                        </p>
                    </div>

                    <form method="post" action="">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn bg-gradient-danger btn-round mb-2">
                                <i class="far fa-trash-alt me-2 text-xs"></i> Yes, delete dish
                            </button>
                            <a href="{% url 'kitchen:dish-list' %}" class="btn btn-outline-secondary btn-round mb-0">Cancel</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
