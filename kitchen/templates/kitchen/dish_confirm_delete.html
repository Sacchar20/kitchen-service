{% extends "kitchen/base.html" %}

{% block content %}
    <h1>Delete Dish</h1>
    
    <p>Are you sure you want to delete the dish: <strong>{{ dish.name }}</strong>?</p>

    <form method="post" action="">
        {% csrf_token %}
        <input type="submit" value="Yes, delete">
    </form>
    
    <p><a href="{% url 'kitchen:dish-list' %}">Cancel</a></p>
{% endblock %}
