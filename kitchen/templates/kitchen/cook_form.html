{% extends "kitchen/base.html" %}

{% block content %}
    <h1>{% if object %}Update Profile{% else %}Register New Cook{% endif %}</h1>

    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Save">
    </form>
    
    <p><a href="{% url 'kitchen:cook-list' %}">Cancel</a></p>
{% endblock %}
